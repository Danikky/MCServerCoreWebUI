{% extends 'base.html' %}
{% block title %}О панели{% endblock %}

{% block body %}
<div class="container-mc">
  <div class="page-title"><h1>О панели</h1></div>
  <div class="card-mc" style="max-width:480px">
    <h3 style="font-family:var(--font-mono);font-size:15px;color:var(--accent);margin-bottom:16px">MCServerCore WebUI</h3>
    <p style="color:var(--text-secondary);font-size:13px;line-height:1.8">Веб-панель управления Minecraft сервером на Flask + SocketIO.</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:16px">
      <span class="badge-mc badge-green">Flask</span>
      <span class="badge-mc badge-blue">SocketIO</span>
      <span class="badge-mc badge-gray">SQLite</span>
      <span class="badge-mc badge-yellow">Bootstrap 5</span>
    </div>
  </div>
</div>
{% endblock %}
