{% extends 'base.html' %}
{% block title %}Главная{% endblock %}

{% block body %}
<div class="container-mc">
  <!-- Залогиненных misc.index сразу редиректит на /servers — сюда попадают
       только неавторизованные посетители. -->
  <div style="min-height:calc(100vh - var(--nav-height));display:flex;align-items:center;justify-content:center;text-align:center">
    <div class="fade-up">
      <div style="font-size:64px;margin-bottom:20px">⛏</div>
      <h1 style="font-family:var(--font-mono);font-size:28px;font-weight:600;color:var(--text-primary);margin-bottom:8px">MCServerCore</h1>
      <p style="color:var(--text-secondary);font-size:15px;margin-bottom:32px">Веб-панель управления Minecraft сервером</p>
      <a href="{{ url_for('auth.login') }}" class="btn-mc btn-primary-mc" style="padding:12px 32px;font-size:14px">Войти в панель</a>
    </div>
  </div>
</div>
{% endblock %}
