{% extends 'base.html' %}
{% block title %}Вход{% endblock %}

{% block body %}
<div class="auth-wrap">
  <div class="auth-card fade-up">
    <div class="auth-logo">
      <div class="logo-icon">⛏</div>
      <h2>MCServerCore</h2>
      <p>Панель управления сервером</p>
    </div>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for msg in messages %}
          <div class="alert-mc alert-mc-danger" style="margin-bottom:16px">{{ msg }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST">
      <div class="form-group-mc">
        <label class="form-label-mc">Имя пользователя</label>
        <input type="text" name="username" class="form-control" placeholder="admin" required autocomplete="username">
      </div>
      <div class="form-group-mc" style="margin-bottom:24px">
        <label class="form-label-mc">Пароль</label>
        <input type="password" name="password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn-mc btn-primary-mc w-full" style="justify-content:center;padding:10px">
        Войти
      </button>
    </form>
  </div>
</div>
{% endblock %}
