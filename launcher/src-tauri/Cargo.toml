[package]
name = "mcsc-launcher"
version = "0.1.0"
description = "Клиентский лаунчер MCServerCore — авто-синхронизация версии/IP/модов и запуск Minecraft"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util"] }
thiserror = "2"

# Задел на следующие шаги M1 (скачивание/установка/запуск) — уже в Cargo.toml,
# чтобы не гонять cargo add по кругу на каждом шаге плана:
sha1 = "0.10"
directories = "5"
zip = { version = "2", default-features = false, features = ["deflate"] }
