{% extends 'base.html' %}
{% block title %}Настройки{% endblock %}

{% block body %}
<div class="container-mc">
  <div class="flex-between" style="margin-bottom:20px">
    <div class="page-title" style="margin-bottom:0">
      <h1>Настройки сервера</h1>
      <span>server.properties</span>
    </div>
    <form method="post" id="settings-form">
      <button type="submit" class="btn-mc btn-primary-mc">
        <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
        Сохранить изменения
      </button>
    </form>
  </div>

  <div class="card-mc">
    <div class="settings-grid">
      {% for el in properties_data %}
      <div class="setting-item">
        <div class="setting-key">{{ el[0] }}</div>
        <input
          type="text"
          name="{{ el[0] }}"
          form="settings-form"
          class="form-control"
          value="{{ el[1] }}"
          placeholder="{{ el[1] }}">
      </div>
      {% endfor %}
    </div>
  </div>
</div>
{% endblock %}
