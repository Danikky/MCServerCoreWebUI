{% extends 'base.html' %}
{% block title %}Регистрация{% endblock %}

{% block body %}
<div class="auth-wrap">
  <div class="auth-card fade-up">
    <div class="auth-logo">
      <div class="logo-icon">⛏</div>
      <h2>Регистрация</h2>
      <p>Создать аккаунт панели</p>
    </div>

    <form method="POST">
      <div class="form-group-mc">
        <label class="form-label-mc">Имя пользователя</label>
        <input type="text" name="username" class="form-control" placeholder="myusername" required>
      </div>
      <div class="form-group-mc" style="margin-bottom:24px">
        <label class="form-label-mc">Пароль</label>
        <input type="password" name="password" class="form-control" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn-mc btn-primary-mc w-full" style="justify-content:center;padding:10px">
        Создать аккаунт
      </button>
      <div style="text-align:center;margin-top:14px">
        <a href="{{ url_for('login') }}" style="color:var(--text-muted);font-size:13px;text-decoration:none">Уже есть аккаунт? Войти</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
